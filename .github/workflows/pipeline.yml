# Test on every pull request; on merge to main, publish and deploy. The steps live in jennpcfo/ci.
name: pipeline
on:
  pull_request:
  push:
    branches: [main]
    paths-ignore: ["deploy/**", "**.md"]
permissions:
  contents: write
  packages: write
jobs:
  app:
    uses: jennpcfo/ci/.github/workflows/app.yml@d5f0dccd63ae7bf723090e59f827df60ac68a9f3 # v1
    with:
      image: ghcr.io/jennpcfo/pourprofitcfo-site
