# Test on every pull request; on merge to main, publish and deploy. The steps live in jennpcfo/ci.
name: pipeline
on:
  pull_request:
  push:
    branches: [main]
    paths-ignore: ["deploy/**", "**.md"]
permissions:
  contents: write
  packages: write
jobs:
  app:
    uses: jennpcfo/ci/.github/workflows/app.yml@3653d0d23c53f28dbc197925cb06baaaf737039f # TODO: v1 commit after jennpcfo/ci#1 merges
    with:
      image: ghcr.io/jennpcfo/pourprofitcfo-site
