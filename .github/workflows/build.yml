# Builds the site image on every change to main and pushes it to GHCR, tagged with the commit.
# Deploying a new build is a separate, reviewable step: bump the tag in deploy/deployment.yaml.
name: build
on:
  push:
    branches: [main]
    paths: [site/**, Dockerfile, nginx.conf, .github/workflows/build.yml]
  workflow_dispatch:
permissions:
  contents: read
  packages: write
jobs:
  image:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: ghcr.io/jennpcfo/pourprofitcfo-site:${{ github.sha }}
          labels: org.opencontainers.image.source=https://github.com/jennpcfo/pourprofitcfo-site
